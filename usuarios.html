<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gala ERP — Usuarios</title>
<style>
  html, body { margin: 0; padding: 0; }
  ::-webkit-scrollbar { display: none; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "surface": "#131411", "surface-container": "#20201d", "surface-container-low": "#1c1c19",
        "surface-container-high": "#2a2a27", "primary-container": "#0d1b2a",
        "on-surface": "#e5e2dd", "on-surface-variant": "#c4c6cc",
        "tertiary": "#e9c349", "on-tertiary": "#3c2f00", "error": "#ffb4ab", "secondary-container": "#2a486b", "secondary": "#abc9f2"
      },
      fontFamily: { "headline-lg": ["Playfair Display"], "headline-md": ["Playfair Display"], "body-md": ["Inter"], "button-text": ["Inter"] }
    }
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen">

<header class="h-20 flex items-center justify-between px-8 border-b border-tertiary/10 bg-primary-container">
  <div class="flex items-center gap-3">
    <a href="proyectos.html" class="material-symbols-outlined text-on-surface-variant hover:text-tertiary transition-colors" title="Volver a Mis Proyectos">arrow_back</a>
    <img alt="Logo" class="w-9 h-9 object-contain" src="assets/logo.png"/>
    <span class="font-headline-md text-headline-md text-tertiary tracking-widest uppercase">GALA</span>
  </div>
  <div class="flex items-center gap-4">
    <div id="role-badge" class="w-8 h-8 rounded-full flex items-center justify-center transition-colors" title="">
      <span class="material-symbols-outlined role-badge-icon text-[18px]"></span>
    </div>
    <button id="logout-btn" class="material-symbols-outlined text-on-surface-variant hover:text-error transition-colors" title="Cerrar sesión">logout</button>
    <div class="flex flex-col leading-tight text-right">
      <span id="current-user-name" class="text-sm text-on-surface">Cargando…</span>
      <span id="current-user-role" class="text-[10px] uppercase tracking-wider text-tertiary"></span>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-8 py-16 flex flex-col gap-10">
  <div class="flex flex-col gap-2">
    <span class="font-label-gold text-xs uppercase tracking-[0.2em] text-tertiary">Administración</span>
    <h1 class="font-headline-lg text-4xl text-on-surface">Usuarios</h1>
    <p class="text-on-surface-variant">Aprueba cuentas nuevas y administra los roles de tu equipo.</p>
  </div>

  <!-- Pendientes de aprobación -->
  <section id="pending-section" class="hidden flex flex-col gap-4">
    <h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-3">
      <span class="material-symbols-outlined text-tertiary">hourglass_top</span>
      Esperando aprobación
      <span id="pending-count" class="px-2 py-1 bg-tertiary/10 text-tertiary font-label-gold text-xs rounded-full">0</span>
    </h2>
    <div id="pending-list" class="flex flex-col gap-3"></div>
  </section>

  <!-- Todos los usuarios -->
  <section class="flex flex-col gap-4">
    <h2 class="font-headline-md text-headline-md text-on-surface">Todo el equipo</h2>
    <div class="bg-surface-container-low rounded-2xl shadow-lg overflow-hidden border border-tertiary/10">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-surface-container border-b border-tertiary/10">
            <th class="py-4 px-6 font-label-gold text-xs uppercase tracking-widest text-on-surface-variant">Nombre</th>
            <th class="py-4 px-6 font-label-gold text-xs uppercase tracking-widest text-on-surface-variant">Correo</th>
            <th class="py-4 px-6 font-label-gold text-xs uppercase tracking-widest text-on-surface-variant">Rol</th>
            <th class="py-4 px-6 font-label-gold text-xs uppercase tracking-widest text-on-surface-variant">Plan</th>
            <th class="py-4 px-6 font-label-gold text-xs uppercase tracking-widest text-on-surface-variant">Eventos</th>
            <th class="py-4 px-6 font-label-gold text-xs uppercase tracking-widest text-on-surface-variant">Estatus</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="6" class="py-8 px-6 text-center text-on-surface-variant">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script type="module">
  const pendingSection = document.getElementById("pending-section");
  const pendingList = document.getElementById("pending-list");
  const pendingCount = document.getElementById("pending-count");
  const usersTbody = document.getElementById("users-tbody");

  let allProfiles = [];
  let myUserId = null;

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function formatDate(dateStr) {
    if (!dateStr) return "";
    return new Date(dateStr).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
  }

  function renderPending() {
    const pending = allProfiles.filter(p => !p.is_approved && p.role !== "admin");
    pendingSection.classList.toggle("hidden", pending.length === 0);
    pendingCount.textContent = pending.length;
    pendingList.innerHTML = pending.map(p => `
      <div class="bg-surface-container rounded-xl p-5 flex items-center justify-between gap-4 border border-tertiary/10" data-id="${p.id}">
        <div class="flex flex-col">
          <span class="text-on-surface font-medium">${escapeHtml(p.full_name || "(sin nombre)")}</span>
          <span class="text-on-surface-variant text-sm">${escapeHtml(p.email || "")}</span>
          <span class="text-on-surface-variant text-xs mt-1">Se registró el ${formatDate(p.created_at)}</span>
        </div>
        <div class="flex gap-2 shrink-0">
          <button class="btn-approve px-4 py-2 bg-tertiary text-on-tertiary rounded-lg text-sm font-button-text uppercase tracking-wider hover:brightness-110 transition-all flex items-center gap-1.5">
            <span class="material-symbols-outlined text-[16px]">check</span>Aprobar
          </button>
          <button class="btn-reject px-4 py-2 border border-error/30 text-error rounded-lg text-sm hover:bg-error/10 transition-colors flex items-center gap-1.5">
            <span class="material-symbols-outlined text-[16px]">close</span>Rechazar
          </button>
        </div>
      </div>
    `).join("");
  }

  let allEvents = [];

  function renderTable() {
    const rest = allProfiles.filter(p => p.is_approved || p.role === "admin");
    usersTbody.innerHTML = rest.map(p => {
      // Correlacionar eventos creados por cada usuario
      const userEvents = allEvents.filter(ev => ev.user_id === p.id);
      const eventsListHtml = userEvents.length > 0
        ? userEvents.map(ev => `<span class="block text-xs bg-surface-container-high px-2 py-0.5 rounded text-on-surface/85 max-w-[220px] truncate mb-1" title="${escapeHtml(ev.name)}">${escapeHtml(ev.name)}</span>`).join("")
        : `<span class="text-on-surface-variant/40 text-xs italic">Sin eventos creados</span>`;

      return `
        <tr class="border-b border-tertiary/5 hover:bg-surface-container/50 transition-colors" data-id="${p.id}">
          <td class="py-4 px-6 text-on-surface">${escapeHtml(p.full_name || "(sin nombre)")}</td>
          <td class="py-4 px-6 text-on-surface-variant text-sm">${escapeHtml(p.email || "")}</td>
          <td class="py-4 px-6">
            <select class="role-select bg-surface-container border border-tertiary/20 rounded px-2.5 py-1 text-on-surface text-xs focus:outline-none focus:border-tertiary" ${p.id === myUserId ? "disabled" : ""}>
              <option value="colaborador" ${p.role === "colaborador" ? "selected" : ""}>Colaborador</option>
              <option value="organizador" ${p.role === "organizador" ? "selected" : ""}>Organizador</option>
              <option value="admin" ${p.role === "admin" ? "selected" : ""}>Admin</option>
            </select>
          </td>
          <td class="py-4 px-6">
            <select class="plan-select bg-surface-container border border-tertiary/20 rounded px-2.5 py-1 text-on-surface text-xs focus:outline-none focus:border-tertiary">
              <option value="free" ${p.plan === "free" ? "selected" : ""}>Gratis (Free)</option>
              <option value="standard" ${p.plan === "standard" ? "selected" : ""}>Standard</option>
              <option value="agency" ${p.plan === "agency" ? "selected" : ""}>Agency</option>
            </select>
          </td>
          <td class="py-4 px-6">
            <div class="flex flex-col max-h-[80px] overflow-y-auto">${eventsListHtml}</div>
          </td>
          <td class="py-4 px-6">
            <span class="px-2.5 py-1 rounded-full bg-secondary/10 text-secondary text-xs font-label-gold uppercase">Activo</span>
          </td>
        </tr>`;
    }).join("");
  }

  async function loadUsers() {
    try {
      const { data: eventsData } = await window.supabaseClient.from("events").select("*");
      allEvents = eventsData || [];
    } catch(e) {
      console.warn("No se pudieron cargar eventos de otros usuarios:", e);
    }

    const { data, error } = await window.supabaseClient.from("profiles").select("*").order("created_at", { ascending: false });
    if (error) {
      usersTbody.innerHTML = `<tr><td colspan="6" class="py-8 px-6 text-center text-error">Error: ${escapeHtml(error.message)}</td></tr>`;
      return;
    }
    allProfiles = data || [];
    renderPending();
    renderTable();
  }

  pendingList.addEventListener("click", async (e) => {
    const card = e.target.closest("[data-id]");
    if (!card) return;
    const id = card.getAttribute("data-id");

    if (e.target.closest(".btn-approve")) {
      const { error } = await window.supabaseClient.from("profiles").update({ is_approved: true }).eq("id", id);
      if (error) { alert("No se pudo aprobar: " + error.message); return; }
      await loadUsers();
    }
    if (e.target.closest(".btn-reject")) {
      if (!confirm("¿Rechazar esta cuenta? Seguirá sin poder entrar. (No se elimina el registro, solo se mantiene sin aprobar.)")) return;
      card.remove();
    }
  });

  usersTbody.addEventListener("change", async (e) => {
    const roleSelect = e.target.closest(".role-select");
    if (roleSelect) {
      const row = roleSelect.closest("[data-id]");
      const id = row.getAttribute("data-id");
      const { error } = await window.supabaseClient.from("profiles").update({ role: roleSelect.value }).eq("id", id);
      if (error) {
        alert("No se pudo cambiar el rol: " + error.message);
      } else {
        window.showToast("Rol de usuario actualizado", "success");
      }
      return;
    }

    const planSelect = e.target.closest(".plan-select");
    if (planSelect) {
      const row = planSelect.closest("[data-id]");
      const id = row.getAttribute("data-id");
      const { error } = await window.supabaseClient.from("profiles").update({ plan: planSelect.value }).eq("id", id);
      if (error) {
        alert("No se pudo cambiar el plan: " + error.message);
      } else {
        window.showToast("Plan de usuario actualizado correctamente", "success");
      }
      return;
    }
  });

  (async function init() {
    const auth = await window.requireAuth();
    if (!auth) return;

    if (!auth.profile || auth.profile.role !== "admin") {
      alert("Esta página es solo para administradores.");
      window.location.href = "proyectos.html";
      return;
    }

    myUserId = auth.user.id;
    document.getElementById("current-user-name").textContent = auth.profile.full_name || auth.user.email;
    document.getElementById("current-user-role").textContent = auth.profile.role;
    window.applyRoleBadge(auth.profile.role);
    document.getElementById("logout-btn").addEventListener("click", window.signOut);

    await loadUsers();
  })();
</script>
</body>
</html>
