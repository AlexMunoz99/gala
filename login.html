<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gala ERP — Iniciar sesión</title>
<style>
  html, body { margin: 0; padding: 0; }
  ::-webkit-scrollbar { display: none; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "surface": "#131411",
        "surface-container": "#20201d",
        "surface-container-low": "#1c1c19",
        "surface-container-high": "#2a2a27",
        "on-surface": "#e5e2dd",
        "on-surface-variant": "#c4c6cc",
        "tertiary": "#e9c349",
        "on-tertiary": "#3c2f00",
        "error": "#ffb4ab",
        "secondary-container": "#2a486b"
      },
      fontFamily: {
        "headline-lg": ["Playfair Display"],
        "body-md": ["Inter"],
        "button-text": ["Inter"]
      }
    }
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex items-center justify-center px-6 relative overflow-hidden">

<div id="grid-pattern-wrap" class="pointer-events-none absolute inset-x-0 inset-y-[-30%] h-[200%] -skew-y-12" style="-webkit-mask-image: radial-gradient(500px circle at center, white, transparent); mask-image: radial-gradient(500px circle at center, white, transparent);">
  <svg class="w-full h-full">
    <defs>
      <pattern id="grid-lines" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e9c349" stroke-opacity="0.08"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid-lines)"/>
    <g id="grid-squares"></g>
  </svg>
</div>

<div class="w-full max-w-md relative z-10">
  <div class="flex flex-col items-center gap-3 mb-10">
    <img alt="Logo" class="w-16 h-16 object-contain" src="assets/logo.png"/>
    <span class="font-headline-lg text-3xl text-tertiary tracking-widest uppercase">GALA</span>
    <p class="text-on-surface-variant text-sm">Planificación y gestión de eventos</p>
  </div>

  <div class="bg-surface-container/80 backdrop-blur-xl border border-tertiary/10 rounded-2xl p-8 shadow-2xl">
    <div class="flex mb-8 rounded-lg bg-surface-container-low p-1">
      <button id="tab-login" class="flex-1 py-2 rounded-md font-button-text text-sm uppercase tracking-wider bg-tertiary text-on-tertiary transition-colors">Entrar</button>
      <button id="tab-signup" class="flex-1 py-2 rounded-md font-button-text text-sm uppercase tracking-wider text-on-surface-variant transition-colors">Crear cuenta</button>
    </div>

    <form id="auth-form" class="flex flex-col gap-4">
      <div id="signup-name-wrap" class="hidden flex-col gap-1">
        <label class="text-xs uppercase tracking-wider text-on-surface-variant" for="full_name">Nombre completo</label>
        <input class="bg-surface-container-low border border-tertiary/20 rounded-lg py-3 px-4 text-on-surface focus:outline-none focus:border-tertiary transition-colors" id="full_name" type="text" placeholder="Tu nombre"/>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs uppercase tracking-wider text-on-surface-variant" for="email">Correo</label>
        <input class="bg-surface-container-low border border-tertiary/20 rounded-lg py-3 px-4 text-on-surface focus:outline-none focus:border-tertiary transition-colors" id="email" required="" type="email" placeholder="tu@correo.com"/>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs uppercase tracking-wider text-on-surface-variant" for="password">Contraseña</label>
        <input class="bg-surface-container-low border border-tertiary/20 rounded-lg py-3 px-4 text-on-surface focus:outline-none focus:border-tertiary transition-colors" id="password" required="" type="password" placeholder="••••••••" minlength="6"/>
      </div>
      <button type="button" id="forgot-password-btn" class="text-xs text-tertiary hover:text-tertiary-fixed transition-colors self-end -mt-2">¿Olvidaste tu contraseña?</button>

      <p id="auth-message" class="text-sm hidden"></p>

      <button class="mt-2 py-3 bg-tertiary text-on-tertiary font-button-text uppercase tracking-widest rounded-lg hover:brightness-110 transition-all disabled:opacity-50" id="submit-btn" type="submit">
        Entrar
      </button>
    </form>
  </div>
</div>

<script type="module">
  const form = document.getElementById("auth-form");
  const tabLogin = document.getElementById("tab-login");
  const tabSignup = document.getElementById("tab-signup");
  const signupNameWrap = document.getElementById("signup-name-wrap");
  const submitBtn = document.getElementById("submit-btn");
  const messageEl = document.getElementById("auth-message");

  let mode = "login"; // "login" | "signup"

  function setMode(next) {
    mode = next;
    const isSignup = mode === "signup";
    signupNameWrap.classList.toggle("hidden", !isSignup);
    signupNameWrap.classList.toggle("flex", isSignup);
    submitBtn.textContent = isSignup ? "Crear cuenta" : "Entrar";
    tabLogin.classList.toggle("bg-tertiary", !isSignup);
    tabLogin.classList.toggle("text-on-tertiary", !isSignup);
    tabLogin.classList.toggle("text-on-surface-variant", isSignup);
    tabSignup.classList.toggle("bg-tertiary", isSignup);
    tabSignup.classList.toggle("text-on-tertiary", isSignup);
    tabSignup.classList.toggle("text-on-surface-variant", !isSignup);
    document.getElementById("forgot-password-btn").classList.toggle("hidden", isSignup);
    messageEl.classList.add("hidden");
  }

  tabLogin.addEventListener("click", () => setMode("login"));
  tabSignup.addEventListener("click", () => setMode("signup"));

  function showMessage(text, isError) {
    messageEl.textContent = text;
    messageEl.classList.remove("hidden");
    messageEl.classList.toggle("text-error", isError);
    messageEl.classList.toggle("text-tertiary", !isError);
  }

  // Si ya hay sesión activa, saltar directo al panel
  window.supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = "proyectos.html";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (mode === "signup") {
      const full_name = document.getElementById("full_name").value.trim();
      const { error } = await window.supabaseClient.auth.signUp({
        email, password,
        options: { data: { full_name } }
      });
      if (error) {
        showMessage(error.message, true);
      } else {
        showMessage("Cuenta creada. Revisa tu correo para confirmarla, luego inicia sesión.", false);
        setMode("login");
      }
    } else {
      const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        showMessage(error.message, true);
      } else {
        window.location.href = "proyectos.html";
      }
    }
    submitBtn.disabled = false;
  });

  document.getElementById("forgot-password-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) {
      showMessage("Escribe tu correo arriba primero, luego dale clic aquí.", true);
      return;
    }
    const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname.replace("login.html", "restablecer-contrasena.html")
    });
    if (error) {
      showMessage(error.message, true);
    } else {
      showMessage("Te enviamos un correo con el enlace para restablecer tu contraseña.", false);
    }
  });
</script>

<script>
  // Recreación en JS puro del componente AnimatedGridPattern (MagicUI),
  // que en el original usa React + Framer Motion.
  (function () {
    function init() {
    const CELL = 40;              // mismo tamaño de celda que el patrón de líneas
    const NUM_SQUARES = 30;       // numSquares
    const MAX_OPACITY = 0.35;     // maxOpacity del original (0.1) ajustado un poco más visible sobre negro
    const DURATION = 3000;        // duration (ms)
    const REPEAT_DELAY = 1000;    // repeatDelay (ms)

    const wrap = document.getElementById("grid-pattern-wrap");
    const svg = wrap.querySelector("svg");
    const group = document.getElementById("grid-squares");
    const SVG_NS = "http://www.w3.org/2000/svg";

    function cols() { return Math.ceil(wrap.clientWidth / CELL) + 1; }
    function rows() { return Math.ceil(wrap.clientHeight / CELL) + 1; }

    function randomPos() {
      return [Math.floor(Math.random() * cols()), Math.floor(Math.random() * rows())];
    }

    function animateSquare(rect) {
      const [c, r] = randomPos();
      rect.setAttribute("x", c * CELL);
      rect.setAttribute("y", r * CELL);

      const anim = rect.animate(
        [
          { opacity: 0 },
          { opacity: MAX_OPACITY, offset: 0.5 },
          { opacity: 0 }
        ],
        { duration: DURATION, easing: "ease-in-out" }
      );
      anim.onfinish = () => {
        setTimeout(() => animateSquare(rect), REPEAT_DELAY);
      };
    }

    const squares = [];
    for (let i = 0; i < NUM_SQUARES; i++) {
      const rect = document.createElementNS(SVG_NS, "rect");
      rect.setAttribute("width", CELL - 1);
      rect.setAttribute("height", CELL - 1);
      rect.setAttribute("fill", "#e9c349");
      rect.setAttribute("opacity", "0");
      group.appendChild(rect);
      squares.push(rect);
    }

    // Escalona el arranque de cada cuadro, como hace el original
    squares.forEach((rect) => {
      const initialDelay = Math.random() * (DURATION + REPEAT_DELAY);
      setTimeout(() => animateSquare(rect), initialDelay);
    });
    }

    window.addEventListener("load", init);
  })();
</script>
</body>
</html>
