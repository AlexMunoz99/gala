<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gala ERP — Iniciar sesión</title>
<style>
  html, body { margin: 0; padding: 0; }
  ::-webkit-scrollbar { display: none; }
  #shader-bg { position: fixed; inset: 0; z-index: 0; display: block; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "surface": "#131411",
        "surface-container": "#20201d",
        "surface-container-low": "#1c1c19",
        "surface-container-high": "#2a2a27",
        "on-surface": "#e5e2dd",
        "on-surface-variant": "#c4c6cc",
        "tertiary": "#e9c349",
        "on-tertiary": "#3c2f00",
        "error": "#ffb4ab",
        "secondary-container": "#2a486b"
      },
      fontFamily: {
        "headline-lg": ["Playfair Display"],
        "body-md": ["Inter"],
        "button-text": ["Inter"]
      }
    }
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex items-center justify-center px-6 relative overflow-hidden">

<canvas id="shader-bg"></canvas>

<div class="w-full max-w-md relative z-10">
  <div class="flex flex-col items-center gap-3 mb-10">
    <img alt="Logo" class="w-16 h-16 object-contain" src="assets/logo.png"/>
    <span class="font-headline-lg text-3xl text-tertiary tracking-widest uppercase">GALA</span>
    <p class="text-on-surface-variant text-sm">Planificación y gestión de eventos</p>
  </div>

  <div class="bg-surface-container/80 backdrop-blur-xl border border-tertiary/10 rounded-2xl p-8 shadow-2xl">
    <div class="flex mb-8 rounded-lg bg-surface-container-low p-1">
      <button id="tab-login" class="flex-1 py-2 rounded-md font-button-text text-sm uppercase tracking-wider bg-tertiary text-on-tertiary transition-colors">Entrar</button>
      <button id="tab-signup" class="flex-1 py-2 rounded-md font-button-text text-sm uppercase tracking-wider text-on-surface-variant transition-colors">Crear cuenta</button>
    </div>

    <form id="auth-form" class="flex flex-col gap-4">
      <div id="signup-name-wrap" class="hidden flex-col gap-1">
        <label class="text-xs uppercase tracking-wider text-on-surface-variant" for="full_name">Nombre completo</label>
        <input class="bg-surface-container-low border border-tertiary/20 rounded-lg py-3 px-4 text-on-surface focus:outline-none focus:border-tertiary transition-colors" id="full_name" type="text" placeholder="Tu nombre"/>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs uppercase tracking-wider text-on-surface-variant" for="email">Correo</label>
        <input class="bg-surface-container-low border border-tertiary/20 rounded-lg py-3 px-4 text-on-surface focus:outline-none focus:border-tertiary transition-colors" id="email" required="" type="email" placeholder="tu@correo.com"/>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs uppercase tracking-wider text-on-surface-variant" for="password">Contraseña</label>
        <input class="bg-surface-container-low border border-tertiary/20 rounded-lg py-3 px-4 text-on-surface focus:outline-none focus:border-tertiary transition-colors" id="password" required="" type="password" placeholder="••••••••" minlength="6"/>
      </div>

      <p id="auth-message" class="text-sm hidden"></p>

      <button class="mt-2 py-3 bg-tertiary text-on-tertiary font-button-text uppercase tracking-widest rounded-lg hover:brightness-110 transition-all disabled:opacity-50" id="submit-btn" type="submit">
        Entrar
      </button>
    </form>
  </div>
</div>

<script type="module">
  const form = document.getElementById("auth-form");
  const tabLogin = document.getElementById("tab-login");
  const tabSignup = document.getElementById("tab-signup");
  const signupNameWrap = document.getElementById("signup-name-wrap");
  const submitBtn = document.getElementById("submit-btn");
  const messageEl = document.getElementById("auth-message");

  let mode = "login"; // "login" | "signup"

  function setMode(next) {
    mode = next;
    const isSignup = mode === "signup";
    signupNameWrap.classList.toggle("hidden", !isSignup);
    signupNameWrap.classList.toggle("flex", isSignup);
    submitBtn.textContent = isSignup ? "Crear cuenta" : "Entrar";
    tabLogin.classList.toggle("bg-tertiary", !isSignup);
    tabLogin.classList.toggle("text-on-tertiary", !isSignup);
    tabLogin.classList.toggle("text-on-surface-variant", isSignup);
    tabSignup.classList.toggle("bg-tertiary", isSignup);
    tabSignup.classList.toggle("text-on-tertiary", isSignup);
    tabSignup.classList.toggle("text-on-surface-variant", !isSignup);
    messageEl.classList.add("hidden");
  }

  tabLogin.addEventListener("click", () => setMode("login"));
  tabSignup.addEventListener("click", () => setMode("signup"));

  function showMessage(text, isError) {
    messageEl.textContent = text;
    messageEl.classList.remove("hidden");
    messageEl.classList.toggle("text-error", isError);
    messageEl.classList.toggle("text-tertiary", !isError);
  }

  // Si ya hay sesión activa, saltar directo al panel
  window.supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = "index.html";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (mode === "signup") {
      const full_name = document.getElementById("full_name").value.trim();
      const { error } = await window.supabaseClient.auth.signUp({
        email, password,
        options: { data: { full_name } }
      });
      if (error) {
        showMessage(error.message, true);
      } else {
        showMessage("Cuenta creada. Revisa tu correo para confirmarla, luego inicia sesión.", false);
        setMode("login");
      }
    } else {
      const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        showMessage(error.message, true);
      } else {
        window.location.href = "index.html";
      }
    }
    submitBtn.disabled = false;
  });
</script>

<script type="module">
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

  const canvas = document.getElementById("shader-bg");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.FogExp2(0x000000, 0.14);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  // Cámara casi a ras del "agua", mirando ligeramente hacia abajo — recrea el ángulo
  // (cAzimuthAngle 180 / cPolarAngle 95 / cDistance 2.4) del ShaderGradient original.
  camera.position.set(0, 0.35, 2.4);
  camera.lookAt(0, -0.15, 0);

  // --- Plano "waterPlane" con desplazamiento por ondas y gradiente animado ---
  const geometry = new THREE.PlaneGeometry(14, 14, 180, 180);

  const uniforms = {
    uTime: { value: 0 },
    // Paleta Aureum Kinetic (dorado sobre negro), en vez del azul/morado original
    uColorDeep:   { value: new THREE.Color(0x050403) },  // casi negro, base
    uColorMid:    { value: new THREE.Color(0x2a2011) },  // bronce oscuro
    uColorAccent: { value: new THREE.Color(0xe9c349) },  // dorado (acento, tenue)
    uFrequency: { value: 1.6 },
    uSpeed: { value: 0.12 },
    uStrength: { value: 0.22 }
  };

  const material = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: `
      uniform float uTime;
      uniform float uFrequency;
      uniform float uSpeed;
      uniform float uStrength;
      varying vec2 vUv;
      varying float vElevation;

      void main() {
        vUv = uv;
        vec3 pos = position;
        float t = uTime * uSpeed;
        float wave =
          sin(pos.x * uFrequency + t * 2.0) * 0.5 +
          sin(pos.y * uFrequency * 1.4 - t * 1.6) * 0.35 +
          sin((pos.x + pos.y) * uFrequency * 0.6 + t) * 0.4;
        pos.z += wave * uStrength;
        vElevation = wave;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColorDeep;
      uniform vec3 uColorMid;
      uniform vec3 uColorAccent;
      varying vec2 vUv;
      varying float vElevation;

      void main() {
        // Gradiente de base: negro -> bronce, de fondo a frente
        vec3 color = mix(uColorDeep, uColorMid, smoothstep(0.0, 1.0, vUv.y));
        // Toques dorados sutiles donde las crestas de la onda son más altas
        float highlight = smoothstep(0.15, 0.55, vElevation);
        color = mix(color, uColorAccent, highlight * 0.25);
        gl_FragColor = vec4(color, 1.0);
      }
    `
  });

  const plane = new THREE.Mesh(geometry, material);
  plane.rotation.x = -Math.PI / 2.15; // recuesta el plano, como una superficie vista de perfil
  plane.position.y = -0.9;
  plane.position.z = -1.5;
  scene.add(plane);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  const clock = new THREE.Clock();
  let rafId;
  function animate() {
    uniforms.uTime.value = clock.getElapsedTime();
    renderer.render(scene, camera);
    rafId = requestAnimationFrame(animate);
  }
  animate();

  // Pausa el render cuando la pestaña no está visible (ahorra batería/CPU)
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      cancelAnimationFrame(rafId);
    } else {
      animate();
    }
  });
</script>
</body>
</html>
