<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gala ERP — Mis Proyectos</title>
<style>
  html, body { margin: 0; padding: 0; }
  ::-webkit-scrollbar { display: none; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "surface": "#131411",
        "surface-container": "#20201d",
        "surface-container-low": "#1c1c19",
        "surface-container-high": "#2a2a27",
        "primary-container": "#0d1b2a",
        "on-surface": "#e5e2dd",
        "on-surface-variant": "#c4c6cc",
        "tertiary": "#e9c349",
        "on-tertiary": "#3c2f00",
        "error": "#ffb4ab",
        "secondary-container": "#2a486b"
      },
      fontFamily: {
        "headline-lg": ["Playfair Display"],
        "headline-md": ["Playfair Display"],
        "body-md": ["Inter"],
        "button-text": ["Inter"]
      }
    }
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen">

<header class="h-20 flex items-center justify-between px-8 border-b border-tertiary/10 bg-primary-container">
  <div class="flex items-center gap-3">
    <img alt="Logo" class="w-9 h-9 object-contain" src="assets/logo.png"/>
    <span class="font-headline-md text-headline-md text-tertiary tracking-widest uppercase">GALA</span>
  </div>
  <div class="flex items-center gap-4">
    <button id="logout-btn" class="material-symbols-outlined text-on-surface-variant hover:text-error transition-colors" title="Cerrar sesión">logout</button>
    <div class="flex flex-col leading-tight text-right">
      <span id="current-user-name" class="text-sm text-on-surface">Cargando…</span>
      <span id="current-user-role" class="text-[10px] uppercase tracking-wider text-tertiary"></span>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-8 py-16 flex flex-col gap-10">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
    <div class="flex flex-col gap-2">
      <span class="font-label-gold text-xs uppercase tracking-[0.2em] text-tertiary">Mis Proyectos</span>
      <h1 class="font-headline-lg text-4xl text-on-surface">Elige un proyecto</h1>
      <p class="text-on-surface-variant">Cada boda o evento vive por separado, con sus propios invitados, presupuesto y equipo.</p>
    </div>
    <button id="btn-new-project" class="px-8 py-4 bg-tertiary text-on-tertiary font-button-text uppercase tracking-widest rounded-lg hover:brightness-110 transition-all flex items-center gap-2 shadow-xl shadow-tertiary/20">
      <span class="material-symbols-outlined">add</span>
      Nuevo Proyecto
    </button>
  </div>

  <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <p class="text-on-surface-variant col-span-full py-10 text-center">Cargando proyectos…</p>
  </div>
</main>

<!-- Modal: Nuevo Proyecto -->
<div id="project-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
  <div id="project-modal-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
  <div class="relative w-full max-w-md bg-surface-container-low rounded-2xl shadow-2xl border border-tertiary/10 p-8">
    <div class="flex items-center justify-between mb-6">
      <h2 class="font-headline-lg text-2xl text-on-surface">Nuevo Proyecto</h2>
      <button id="project-modal-close" class="material-symbols-outlined text-on-surface-variant hover:text-tertiary transition-colors">close</button>
    </div>
    <form id="project-form" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-xs uppercase tracking-wider text-on-surface-variant" for="project-name">Título del proyecto *</label>
        <input id="project-name" required="" placeholder="Boda de Greta y Alex" class="bg-surface-container border border-tertiary/20 rounded-lg py-3 px-4 text-on-surface focus:outline-none focus:border-tertiary" type="text"/>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs uppercase tracking-wider text-on-surface-variant" for="project-date">Fecha estimada</label>
        <input id="project-date" class="bg-surface-container border border-tertiary/20 rounded-lg py-3 px-4 text-on-surface focus:outline-none focus:border-tertiary" type="date"/>
      </div>

      <p id="project-form-error" class="hidden text-error text-sm"></p>

      <div class="flex justify-end gap-3 mt-2">
        <button type="button" id="project-modal-cancel" class="px-6 py-3 rounded-lg border border-tertiary/20 text-on-surface-variant hover:bg-surface-container transition-colors font-button-text uppercase tracking-wider text-sm">Cancelar</button>
        <button type="submit" class="px-8 py-3 rounded-lg bg-tertiary text-on-tertiary font-button-text uppercase tracking-wider text-sm hover:brightness-110 transition-all">Crear y Entrar</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  const grid = document.getElementById("projects-grid");
  const modal = document.getElementById("project-modal");
  const form = document.getElementById("project-form");
  const formError = document.getElementById("project-form-error");

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function formatDate(dateStr) {
    if (!dateStr) return "Sin fecha definida";
    const d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });
  }

  function renderProjects(events) {
    if (events.length === 0) {
      grid.innerHTML = `<div class="col-span-full text-center py-16 flex flex-col items-center gap-4">
        <span class="material-symbols-outlined text-tertiary/40 text-6xl">celebration</span>
        <p class="text-on-surface-variant">Todavía no tienes ningún proyecto. Crea el primero para empezar.</p>
      </div>`;
      return;
    }
    grid.innerHTML = events.map(ev => `
      <button class="project-card text-left bg-surface-container rounded-2xl p-6 shadow-lg hover:-translate-y-1 hover:shadow-2xl transition-all border border-tertiary/10 flex flex-col gap-4" data-id="${ev.id}">
        <div class="w-12 h-12 rounded-full bg-tertiary/10 flex items-center justify-center">
          <span class="material-symbols-outlined text-tertiary">celebration</span>
        </div>
        <div>
          <h3 class="font-headline-lg text-xl text-on-surface mb-1">${escapeHtml(ev.name)}</h3>
          <p class="text-on-surface-variant text-sm">${formatDate(ev.event_date)}</p>
        </div>
        <div class="mt-auto pt-4 border-t border-tertiary/10 flex items-center justify-between">
          <span class="text-tertiary text-xs uppercase tracking-widest font-button-text">${window.formatCountdown(ev.event_date)}</span>
          <span class="material-symbols-outlined text-on-surface-variant">arrow_forward</span>
        </div>
      </button>
    `).join("");
  }

  async function loadProjects() {
    const { data, error } = await window.supabaseClient
      .from("events")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      grid.innerHTML = `<p class="text-error col-span-full py-10 text-center">Error al cargar proyectos: ${escapeHtml(error.message)}</p>`;
      return;
    }
    renderProjects(data || []);
  }

  grid.addEventListener("click", (e) => {
    const card = e.target.closest(".project-card");
    if (!card) return;
    window.selectProject(card.getAttribute("data-id"));
  });

  function openModal() {
    formError.classList.add("hidden");
    form.reset();
    modal.classList.remove("hidden");
    modal.classList.add("flex");
  }
  function closeModal() {
    modal.classList.add("hidden");
    modal.classList.remove("flex");
  }

  document.getElementById("btn-new-project").addEventListener("click", openModal);
  document.getElementById("project-modal-close").addEventListener("click", closeModal);
  document.getElementById("project-modal-cancel").addEventListener("click", closeModal);
  document.getElementById("project-modal-backdrop").addEventListener("click", closeModal);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    formError.classList.add("hidden");
    const name = document.getElementById("project-name").value.trim();
    const event_date = document.getElementById("project-date").value || null;

    const { data, error } = await window.supabaseClient
      .from("events")
      .insert({ name, event_date })
      .select()
      .single();

    if (error) {
      formError.textContent = error.message;
      formError.classList.remove("hidden");
      return;
    }
    window.selectProject(data.id);
  });

  (async function init() {
    const auth = await window.requireAuth();
    if (!auth) return;
    const nameEl = document.getElementById("current-user-name");
    if (nameEl && auth.profile) nameEl.textContent = auth.profile.full_name || auth.user.email;
    const roleEl = document.getElementById("current-user-role");
    if (roleEl && auth.profile) roleEl.textContent = auth.profile.role;
    document.getElementById("logout-btn").addEventListener("click", window.signOut);

    await loadProjects();
  })();
</script>
</body>
</html>
