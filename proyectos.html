<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gala ERP — Mis Proyectos</title>
<style>
  html, body { margin: 0; padding: 0; }
  ::-webkit-scrollbar { display: none; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "surface": "#131411",
        "surface-container": "#20201d",
        "surface-container-low": "#1c1c19",
        "surface-container-high": "#2a2a27",
        "primary-container": "#0d1b2a",
        "on-surface": "#e5e2dd",
        "on-surface-variant": "#c4c6cc",
        "tertiary": "#e9c349",
        "on-tertiary": "#3c2f00",
        "error": "#ffb4ab",
        "secondary-container": "#2a486b"
      },
      fontFamily: {
        "headline-lg": ["Playfair Display"],
        "headline-md": ["Playfair Display"],
        "body-md": ["Inter"],
        "button-text": ["Inter"]
      }
    }
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen">

<header class="h-20 flex items-center justify-between px-8 border-b border-tertiary/10 bg-primary-container">
  <div class="flex items-center gap-3">
    <img alt="Logo" class="w-9 h-9 object-contain" src="assets/logo.png"/>
    <span class="font-headline-md text-headline-md text-tertiary tracking-widest uppercase">GALA</span>
  </div>
  <div class="flex items-center gap-4">
    <a href="usuarios.html" class="admin-only material-symbols-outlined text-on-surface-variant hover:text-tertiary transition-colors" title="Administrar usuarios">group</a>
    <div id="role-badge" class="w-8 h-8 rounded-full flex items-center justify-center transition-colors" title="">
      <span class="material-symbols-outlined role-badge-icon text-[18px]"></span>
    </div>
    <button id="logout-btn" class="material-symbols-outlined text-on-surface-variant hover:text-error transition-colors" title="Cerrar sesión">logout</button>
    <div class="flex flex-col leading-tight text-right">
      <span id="current-user-name" class="text-sm text-on-surface">Cargando…</span>
      <span id="current-user-role" class="text-[10px] uppercase tracking-wider text-tertiary"></span>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-8 py-16 flex flex-col gap-10">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
    <div class="flex flex-col gap-2">
      <span class="font-label-gold text-xs uppercase tracking-[0.2em] text-tertiary">Mis Proyectos</span>
      <h1 class="font-headline-lg text-4xl text-on-surface">Elige un proyecto</h1>
      <p class="text-on-surface-variant">Cada boda o evento vive por separado, con sus propios invitados, presupuesto y equipo.</p>
    </div>
    <div class="flex items-center gap-3">
      <button id="btn-seed-demo" class="px-6 py-4 bg-surface-container-high border border-tertiary/30 text-tertiary font-button-text uppercase tracking-widest rounded-lg hover:bg-tertiary/10 transition-all flex items-center gap-2 shadow-lg cursor-pointer" title="Generar una boda de prueba con todos los módulos cargados">
        <span class="material-symbols-outlined text-[20px]">auto_fix_high</span>
        Cargar Boda Demo
      </button>
      <button id="btn-new-project" class="px-8 py-4 bg-tertiary text-on-tertiary font-button-text uppercase tracking-widest rounded-lg hover:brightness-110 transition-all flex items-center gap-2 shadow-xl shadow-tertiary/20">
        <span class="material-symbols-outlined">add</span>
        Nuevo Proyecto
      </button>
    </div>
  </div>

  <div class="relative max-w-sm">
    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">search</span>
    <input id="project-search" class="w-full bg-surface-container border border-tertiary/20 rounded-lg py-3 pl-12 pr-4 text-on-surface focus:outline-none focus:border-tertiary transition-colors placeholder:text-on-surface-variant/50" placeholder="Buscar proyecto por nombre..." type="text"/>
  </div>

  <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <p class="text-on-surface-variant col-span-full py-10 text-center">Cargando proyectos…</p>
  </div>
</main>

<!-- Modal: Editar Proyecto -->
<div id="edit-project-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
  <div id="edit-project-modal-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
  <div class="relative w-full max-w-md bg-surface-container-low rounded-2xl shadow-2xl border border-tertiary/10 p-8">
    <div class="flex items-center justify-between mb-6">
      <h2 class="font-headline-lg text-2xl text-on-surface">Editar Proyecto</h2>
      <button id="edit-project-modal-close" class="material-symbols-outlined text-on-surface-variant hover:text-tertiary transition-colors">close</button>
    </div>
    <form id="edit-project-form" class="flex flex-col gap-4">
      <input id="edit-project-id" type="hidden"/>
      <div class="flex flex-col gap-1">
        <label class="text-xs uppercase tracking-wider text-on-surface-variant" for="edit-project-name">Título del proyecto *</label>
        <input id="edit-project-name" required="" class="bg-surface-container border border-tertiary/20 rounded-lg py-3 px-4 text-on-surface focus:outline-none focus:border-tertiary" type="text"/>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs uppercase tracking-wider text-on-surface-variant" for="edit-project-date">Fecha estimada</label>
        <input id="edit-project-date" class="bg-surface-container border border-tertiary/20 rounded-lg py-3 px-4 text-on-surface focus:outline-none focus:border-tertiary" type="date"/>
      </div>

      <p id="edit-project-error" class="hidden text-error text-sm"></p>

      <div class="flex justify-between items-center gap-3 mt-2">
        <button type="button" id="edit-project-delete-btn" class="px-4 py-3 rounded-lg text-error hover:bg-error/10 transition-colors font-button-text uppercase tracking-wider text-sm flex items-center gap-2">
          <span class="material-symbols-outlined text-[18px]">delete</span>Eliminar
        </button>
        <div class="flex justify-end gap-3 flex-1">
          <button type="button" id="edit-project-cancel" class="px-6 py-3 rounded-lg border border-tertiary/20 text-on-surface-variant hover:bg-surface-container transition-colors font-button-text uppercase tracking-wider text-sm">Cancelar</button>
          <button type="submit" class="px-8 py-3 rounded-lg bg-tertiary text-on-tertiary font-button-text uppercase tracking-wider text-sm hover:brightness-110 transition-all">Guardar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Nuevo Proyecto -->
<div id="project-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
  <div id="project-modal-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
  <div class="relative w-full max-w-md bg-surface-container-low rounded-2xl shadow-2xl border border-tertiary/10 p-8">
    <div class="flex items-center justify-between mb-6">
      <h2 class="font-headline-lg text-2xl text-on-surface">Nuevo Proyecto</h2>
      <button id="project-modal-close" class="material-symbols-outlined text-on-surface-variant hover:text-tertiary transition-colors">close</button>
    </div>
    <form id="project-form" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-xs uppercase tracking-wider text-on-surface-variant" for="project-name">Título del proyecto *</label>
        <input id="project-name" required="" placeholder="Boda de Greta y Alex" class="bg-surface-container border border-tertiary/20 rounded-lg py-3 px-4 text-on-surface focus:outline-none focus:border-tertiary" type="text"/>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs uppercase tracking-wider text-on-surface-variant" for="project-date">Fecha estimada</label>
        <input id="project-date" class="bg-surface-container border border-tertiary/20 rounded-lg py-3 px-4 text-on-surface focus:outline-none focus:border-tertiary" type="date"/>
      </div>

      <p id="project-form-error" class="hidden text-error text-sm"></p>

      <div class="flex justify-end gap-3 mt-2">
        <button type="button" id="project-modal-cancel" class="px-6 py-3 rounded-lg border border-tertiary/20 text-on-surface-variant hover:bg-surface-container transition-colors font-button-text uppercase tracking-wider text-sm">Cancelar</button>
        <button type="submit" class="px-8 py-3 rounded-lg bg-tertiary text-on-tertiary font-button-text uppercase tracking-wider text-sm hover:brightness-110 transition-all">Crear y Entrar</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  const grid = document.getElementById("projects-grid");
  const modal = document.getElementById("project-modal");
  const form = document.getElementById("project-form");
  const formError = document.getElementById("project-form-error");

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function formatDate(dateStr) {
    if (!dateStr) return "Sin fecha definida";
    const d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });
  }

  let allEvents = [];

  function renderProjects(events) {
    if (events.length === 0) {
      grid.innerHTML = `<div class="col-span-full text-center py-16 flex flex-col items-center gap-4">
        <span class="material-symbols-outlined text-tertiary/40 text-6xl">celebration</span>
        <p class="text-on-surface-variant">${allEvents.length === 0 ? "Todavía no tienes ningún proyecto. Crea el primero para empezar." : "Ningún proyecto coincide con tu búsqueda."}</p>
      </div>`;
      return;
    }
    grid.innerHTML = events.map(ev => `
      <div class="project-card relative text-left bg-surface-container rounded-2xl p-6 shadow-lg hover:-translate-y-1 hover:shadow-2xl transition-all border border-tertiary/10 flex flex-col gap-4 cursor-pointer" data-id="${ev.id}">
        <button class="btn-edit-project absolute top-4 right-4 w-8 h-8 rounded-full bg-surface/60 backdrop-blur flex items-center justify-center text-on-surface-variant hover:text-tertiary transition-colors" title="Editar">
          <span class="material-symbols-outlined text-[18px]">edit</span>
        </button>
        <div class="w-12 h-12 rounded-full bg-tertiary/10 flex items-center justify-center">
          <span class="material-symbols-outlined text-tertiary">celebration</span>
        </div>
        <div>
          <h3 class="font-headline-lg text-xl text-on-surface mb-1 pr-8">${escapeHtml(ev.name)}</h3>
          <p class="text-on-surface-variant text-sm">${formatDate(ev.event_date)}</p>
        </div>
        <div class="mt-auto pt-4 border-t border-tertiary/10 flex items-center justify-between">
          <span class="text-tertiary text-xs uppercase tracking-widest font-button-text">${window.formatCountdown(ev.event_date)}</span>
          <span class="material-symbols-outlined text-on-surface-variant">arrow_forward</span>
        </div>
      </div>
    `).join("");
  }

  function applySearchAndRender() {
    const term = (document.getElementById("project-search").value || "").trim().toLowerCase();
    const filtered = term ? allEvents.filter(ev => (ev.name || "").toLowerCase().includes(term)) : allEvents;
    renderProjects(filtered);
  }

  async function loadProjects() {
    const { data, error } = await window.supabaseClient
      .from("events")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      grid.innerHTML = `<p class="text-error col-span-full py-10 text-center">Error al cargar proyectos: ${escapeHtml(error.message)}</p>`;
      return;
    }
    allEvents = data || [];
    applySearchAndRender();
  }

  document.getElementById("project-search").addEventListener("input", applySearchAndRender);

  grid.addEventListener("click", (e) => {
    const card = e.target.closest(".project-card");
    if (!card) return;
    if (e.target.closest(".btn-edit-project")) {
      const ev = allEvents.find(x => String(x.id) === card.dataset.id);
      openEditModal(ev);
      return;
    }
    window.selectProject(card.getAttribute("data-id"));
  });

  function openEditModal(ev) {
    document.getElementById("edit-project-error").classList.add("hidden");
    document.getElementById("edit-project-id").value = ev.id;
    document.getElementById("edit-project-name").value = ev.name || "";
    document.getElementById("edit-project-date").value = ev.event_date || "";
    const modal = document.getElementById("edit-project-modal");
    modal.classList.remove("hidden");
    modal.classList.add("flex");
  }
  function closeEditModal() {
    const modal = document.getElementById("edit-project-modal");
    modal.classList.add("hidden");
    modal.classList.remove("flex");
  }
  document.getElementById("edit-project-modal-close").addEventListener("click", closeEditModal);
  document.getElementById("edit-project-cancel").addEventListener("click", closeEditModal);
  document.getElementById("edit-project-modal-backdrop").addEventListener("click", closeEditModal);

  document.getElementById("edit-project-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("edit-project-id").value;
    const payload = {
      name: document.getElementById("edit-project-name").value.trim(),
      event_date: document.getElementById("edit-project-date").value || null
    };
    const { error } = await window.supabaseClient.from("events").update(payload).eq("id", id);
    const errEl = document.getElementById("edit-project-error");
    if (error) {
      errEl.textContent = error.message;
      errEl.classList.remove("hidden");
      return;
    }
    closeEditModal();
    await loadProjects();
  });

  document.getElementById("edit-project-delete-btn").addEventListener("click", async () => {
    const id = document.getElementById("edit-project-id").value;
    if (!confirm("¿Eliminar este proyecto? Se borrarán TODOS sus datos (invitados, presupuesto, tareas, etc.) de forma permanente. Esta acción no se puede deshacer.")) return;
    const { error } = await window.supabaseClient.from("events").delete().eq("id", id);
    if (error) {
      alert("No se pudo eliminar: " + error.message);
      return;
    }
    if (localStorage.getItem("galaCurrentEventId") === id) {
      localStorage.removeItem("galaCurrentEventId");
    }
    closeEditModal();
    await loadProjects();
  });

  function openModal() {
    formError.classList.add("hidden");
    form.reset();
    modal.classList.remove("hidden");
    modal.classList.add("flex");
  }
  function closeModal() {
    modal.classList.add("hidden");
    modal.classList.remove("flex");
  }

  document.getElementById("btn-new-project").addEventListener("click", openModal);
  document.getElementById("project-modal-close").addEventListener("click", closeModal);
  document.getElementById("project-modal-cancel").addEventListener("click", closeModal);
  document.getElementById("project-modal-backdrop").addEventListener("click", closeModal);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    formError.classList.add("hidden");
    const name = document.getElementById("project-name").value.trim();
    const event_date = document.getElementById("project-date").value || null;

    const { data, error } = await window.supabaseClient
      .from("events")
      .insert({ name, event_date })
      .select()
      .single();

    if (error) {
      formError.textContent = error.message;
      formError.classList.remove("hidden");
      return;
    }
    window.selectProject(data.id);
  });

  const btnSeedDemo = document.getElementById("btn-seed-demo");
  if (btnSeedDemo) {
    btnSeedDemo.addEventListener("click", async (e) => {
      e.preventDefault();
      btnSeedDemo.disabled = true;
      btnSeedDemo.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">sync</span> Generando...`;
      window.showToast("Generando Boda Demo con invitados, proveedores e itinerario...", "info", 4000);

      try {
        const auth = await window.requireAuth();
        if (!auth) return;

        // 1. Crear Evento
        let event = null;
        const res1 = await window.supabaseClient
          .from("events")
          .insert({ name: "Boda Valentina & Sebastián 2026", event_date: "2026-11-28" })
          .select()
          .single();

        if (!res1.error && res1.data) {
          event = res1.data;
        } else {
          const res2 = await window.supabaseClient
            .from("events")
            .insert({ name: "Boda Valentina & Sebastián 2026", event_date: "2026-11-28", user_id: auth.user.id })
            .select()
            .single();
          if (res2.error) throw new Error(res1.error?.message || res2.error.message);
          event = res2.data;
        }

        const eventId = event.id;

        // 2. Grupos
        const { data: groups } = await window.supabaseClient
          .from("guest_groups")
          .insert([
            { name: "Padrinos", event_id: eventId },
            { name: "Familia de la Novia", event_id: eventId },
            { name: "Familia del Novio", event_id: eventId },
            { name: "Amigos de la Universidad", event_id: eventId },
            { name: "Compañeros de Trabajo / VIP", event_id: eventId }
          ])
          .select();

        const padrinosId = groups ? groups.find(g => g.name === "Padrinos")?.id : null;
        const famNoviaId = groups ? groups.find(g => g.name === "Familia de la Novia")?.id : null;
        const famNovioId = groups ? groups.find(g => g.name === "Familia del Novio")?.id : null;
        const amigosId = groups ? groups.find(g => g.name === "Amigos de la Universidad")?.id : null;
        const vipId = groups ? groups.find(g => g.name === "Compañeros de Trabajo / VIP")?.id : null;

        // 3. Invitados
        await window.supabaseClient.from("guests").insert([
          { full_name: "Lauro Coss Y León Rubio", phone: "3781002030", group_id: padrinosId, rsvp_status: "confirmado", table_number: "Mesa 1 (VIP)", plus_one: true, dietary_notes: "Padrino de Velación", event_id: eventId },
          { full_name: "Itzel Durand Cortés", phone: "3781002031", group_id: padrinosId, rsvp_status: "confirmado", table_number: "Mesa 1 (VIP)", plus_one: false, dietary_notes: "Vegetariana", event_id: eventId },
          { full_name: "Guillermo Martínez Gómez", phone: "3781002040", group_id: famNoviaId, rsvp_status: "confirmado", table_number: "Mesa de Honor", plus_one: true, dietary_notes: "Papá de la Novia", event_id: eventId },
          { full_name: "María Elena Padilla Gutiérrez", phone: "3781002041", group_id: famNoviaId, rsvp_status: "confirmado", table_number: "Mesa de Honor", plus_one: false, dietary_notes: "Mamá de la Novia", event_id: eventId },
          { full_name: "Armando Jiménez Jiménez", phone: "3781002050", group_id: famNovioId, rsvp_status: "confirmado", table_number: "Mesa de Honor", plus_one: true, dietary_notes: "Papá del Novio", event_id: eventId },
          { full_name: "Blanca Delia González Lozano", phone: "3781002051", group_id: famNovioId, rsvp_status: "confirmado", table_number: "Mesa de Honor", plus_one: false, dietary_notes: "Mamá del Novio", event_id: eventId },
          { full_name: "Lic. Rodrigo Barba Casillas", phone: "3781002060", group_id: amigosId, rsvp_status: "confirmado", table_number: "Mesa 4", plus_one: true, event_id: eventId },
          { full_name: "Valeria Estrada Ochoa", phone: "3781002061", group_id: amigosId, rsvp_status: "confirmado", table_number: "Mesa 4", plus_one: true, dietary_notes: "Dama de honor", event_id: eventId },
          { full_name: "Ing. Alejandro Fuentes R.", phone: "3781002070", group_id: vipId, rsvp_status: "confirmado", table_number: "Mesa 5", plus_one: true, dietary_notes: "Socio comercial", event_id: eventId },
          { full_name: "Lic. Lorena Castellanos", phone: "3781002071", group_id: vipId, rsvp_status: "confirmado", table_number: "Mesa 5", plus_one: true, event_id: eventId }
        ]);

        // 4. Lugares
        await window.supabaseClient.from("venues").insert([
          { name: "Parroquia de San Francisco de Asís", capacity: 400, price_tier: "$$", status: "reservado", address: "Plaza Principal, Centro, Tepatitlán de Morelos, Jal.", notes: "Misa a las 6:00 PM", image_url: "assets/hero-gala.jpg", event_id: eventId },
          { name: "Mítico Terraza y Jardín", capacity: 350, price_tier: "$$$$", status: "reservado", address: "Carretera Capilla de Guadalupe Km 4.5, Jalisco", notes: "Recepción de 8:00 PM a 4:00 AM", image_url: "assets/terraza.jpg", event_id: eventId }
        ]);

        // 5. Proveedores
        await window.supabaseClient.from("vendors").insert([
          { name: "Gourmet Banquetes Altamira", category: "Catering", status: "contratado", contract_total: 165000, deposit_amount: 85000, deposit_paid: true, due_date: "2026-11-15", contact_phone: "3787123300", event_id: eventId },
          { name: "Lumière Cinematografía y Foto", category: "Fotografía", status: "contratado", contract_total: 48000, deposit_amount: 24000, deposit_paid: true, due_date: "2026-11-01", contact_phone: "3318223344", event_id: eventId },
          { name: "AudioBeat Live Band & DJ Pro", category: "Música", status: "contratado", contract_total: 55000, deposit_amount: 30000, deposit_paid: true, due_date: "2026-11-10", contact_phone: "3319001122", event_id: eventId },
          { name: "Atelier Floral Jardín Secreto", category: "Flores", status: "contratado", contract_total: 42000, deposit_amount: 20000, deposit_paid: true, due_date: "2026-11-20", contact_phone: "3781229988", event_id: eventId }
        ]);

        // 6. Itinerario
        await window.supabaseClient.from("itinerary_items").insert([
          { title: "Misa Solemne de Matrimonio", start_time: "18:00", day_offset: 0, location: "Parroquia de San Francisco de Asís", description: "Ceremonia religiosa", event_id: eventId },
          { title: "Cóctel de Bienvenida", start_time: "19:30", day_offset: 0, location: "Terraza Mítico Jardín", description: "Canapés finos y fotos", event_id: eventId },
          { title: "Cena de Gala en 4 Tiempos", start_time: "21:00", day_offset: 0, location: "Salón Principal Mítico", description: "Servicio de banquete gourmet", event_id: eventId },
          { title: "Primer Vals de Esposos", start_time: "22:30", day_offset: 0, location: "Pista Central", description: "Canción: 'Hasta Mi Final' con humo bajo", event_id: eventId }
        ]);

        // 7. Tareas
        await window.supabaseClient.from("tasks").insert([
          { title: "Confirmar menú de degustación", description: "Reunión en Altamira", status: "completada", priority: "alta", due_date: "2026-10-15", event_id: eventId },
          { title: "Definir canciones del vals y fiesta", description: "Entregar lista a DJ", status: "en_progreso", priority: "alta", due_date: "2026-11-01", event_id: eventId },
          { title: "Enviar recordatorios de RSVP", description: "Por WhatsApp", status: "pendiente", priority: "alta", due_date: "2026-11-12", event_id: eventId }
        ]);

          bride_father: "Guillermo Martínez Gómez",
          bride_mother: "María Elena Padilla Gutiérrez",
          groom_father: "Armando Jiménez Jiménez",
          groom_mother: "Blanca Delia González Lozano",
          padrino_1: "Lauro Coss Y León Rubio",

        window.showToast("Error: " + err.message, "error", 5000);

  }

  (async function init() {
    try {
      const auth = await window.requireAuth();
      if (!auth) return;
      const nameEl = document.getElementById("current-user-name");
      if (nameEl && auth.profile) nameEl.textContent = auth.profile.full_name || auth.user.email;
      const roleEl = document.getElementById("current-user-role");
      if (roleEl && auth.profile) roleEl.textContent = auth.profile.role;
      if (auth.profile) window.applyRoleBadge(auth.profile.role);
      if (auth.profile && auth.profile.role !== "admin") {
        document.querySelectorAll(".admin-only").forEach(el => el.remove());
      }
      const logoutBtn = document.getElementById("logout-btn");
      if (logoutBtn) logoutBtn.addEventListener("click", window.signOut);
    } catch(err) {
      console.warn("Init auth warning:", err);
    }

    await loadProjects();
  })();
</script>
