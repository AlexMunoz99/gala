<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gala ERP — Cuenta pendiente</title>
<style>
  html, body { margin: 0; padding: 0; }
  ::-webkit-scrollbar { display: none; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "surface": "#131411", "surface-container": "#20201d", "surface-container-low": "#1c1c19",
        "on-surface": "#e5e2dd", "on-surface-variant": "#c4c6cc", "tertiary": "#e9c349", "on-tertiary": "#3c2f00"
      },
      fontFamily: { "headline-lg": ["Playfair Display"], "body-md": ["Inter"] }
    }
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex items-center justify-center px-6">

<div class="w-full max-w-md text-center flex flex-col items-center gap-6">
  <img alt="Logo" class="w-14 h-14 object-contain" src="assets/logo.png"/>
  <div class="w-16 h-16 rounded-full bg-tertiary/10 flex items-center justify-center">
    <span class="material-symbols-outlined text-tertiary text-3xl">hourglass_top</span>
  </div>
  <h1 class="font-headline-lg text-2xl text-on-surface">Tu cuenta está pendiente de aprobación</h1>
  <p class="text-on-surface-variant">
    Ya te registraste correctamente, pero un administrador todavía tiene que darte acceso.
    En cuanto te aprueben, podrás entrar con este mismo correo y contraseña.
  </p>
  <button id="logout-btn" class="mt-4 px-6 py-3 border border-tertiary/20 text-on-surface-variant hover:text-error hover:border-error/40 rounded-lg transition-colors text-sm">
    Cerrar sesión
  </button>
</div>

<script type="module">
  (async function init() {
    const { data: { session } } = await window.supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = "login.html";
      return;
    }
    // Si ya lo aprobaron mientras esperaba, dejarlo pasar
    const { data: profile } = await window.supabaseClient.from("profiles").select("*").eq("id", session.user.id).single();
    if (profile && (profile.is_approved || profile.role === "admin")) {
      window.location.href = "proyectos.html";
      return;
    }
    document.getElementById("logout-btn").addEventListener("click", window.signOut);
  })();
</script>
</body>
</html>
